[project]
name = "tangware"
version = "0.1.0"
description = "Mechanical design as code: parts, mates and assemblies on build123d"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "ast-grep-cli>=0.50.0",
    "bd-warehouse>=0.4.0",
    "build123d>=0.13.0",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
    "mypy>=2.3.0",
    "cadquery-ocp-stubs>=8.0.1.1.0",
]

[project.urls]
Homepage = "https://tangware.com"
Source = "https://github.com/Tangware/library"

[project.scripts]
cad = "cad.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["tests"]
strict = true
empty_parameter_set_mark = "fail_at_collect"
