[project]
name = "dispenser"
version = "0.1.0"
description = "dispenser"
requires-python = ">=3.14"
dependencies = ["tangware"]

[tool.uv.sources]
tangware = { path = "../../../model", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispenser"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["src"]
strict = true
empty_parameter_set_mark = "fail_at_collect"
markers = [
    "check(does_not_catch, subjects): what a design check misses and the parts it covers",
    "study: a slow check run on demand; the gate reads its last verdict",
]
